name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobs_test
      REDIS_URL: redis://localhost:6379
      # Modules read these at import time; none of the tests call out to the real services.
      SUPERTOKENS_URL: http://localhost:3567
      SUPERTOKENS_API_KEY: ci-placeholder
      API_DOMAIN: http://localhost:5001
      WEBSITE_DOMAIN: http://localhost:3000
      APP_DOMAIN: brujula://
      MINIO_REGION: us-east-1 # lets the client sign URLs locally, no MinIO needed in CI
      MINIO_ACCESS_KEY: ci-placeholder
      MINIO_SECRET_KEY: ci-placeholder-secret
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: Brujula <ci@example.com>
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_PRICE_ID_BASIC: price_ci_basic
      STRIPE_PRICE_ID_PRO: price_ci_pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Apply migrations to an empty database
        run: npx drizzle-kit migrate
      - name: Tests
        run: npx vitest run
