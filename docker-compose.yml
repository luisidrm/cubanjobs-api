services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jobs
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Password must be URL-encoded here if it contains reserved URI characters —
      # keep POSTGRES_PASSWORD_URLENCODED in sync with POSTGRES_PASSWORD above.
      POSTGRESQL_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD_URLENCODED}@postgres:5432/jobs
      API_KEYS: ${SUPERTOKENS_API_KEY}
    ports:
      # Host port 43567, not 3567: Windows reserves dynamic TCP ranges
      # (3555-3654 at the time of writing; check with `netsh interface ipv4
      # show excludedportrange protocol=tcp`) and Docker silently fails to
      # bind inside them. The container still listens on 3567 internally,
      # which is why the healthcheck below is unchanged.
      - "43567:3567"
    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host port 46379, not 6379: Windows reserves 6281-6380 (see the note on the
      # supertokens port above). The container still listens on 6379 internally.
      - "46379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # Web console (open http://localhost:9001 in browser)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
